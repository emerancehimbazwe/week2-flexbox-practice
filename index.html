<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A full-screen CSS Flexbox animation demonstrating nine positions.">
    <title>Week 2 | Flexbox Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="page-header">
    </header>

    <main>
        <section class="demo" aria-label="Full-screen Flexbox animation">
            <div class="demo-label">
                <span class="status-dot"></span>

            </div>

            <div class="flex-container">
                <div class="box box-1">1</div>
                <div class="box box-2">2</div>
                <div class="box box-3">3</div>
                <div class="box box-4">4</div>
                <div class="box box-5">5</div>
                <div class="box box-6">6</div>
            </div>

            <p class="position-guide">
                TOP LEFT · TOP CENTER · TOP RIGHT · MIDDLE LEFT · CENTER ·
                MIDDLE RIGHT · BOTTOM LEFT · BOTTOM CENTER · BOTTOM RIGHT
            </p>
        </section>
    </main>

    <footer class="page-footer">
        <p>Week 2 Flexbox Practice</p>
        <p>Created by Himbazwe Emerance</p>
    </footer>
</body>
</html>
